name: Collect sales

on:
  schedule:
    - cron: '*/15 * * * *'   # каждые 15 минут (GitHub может запускать с задержкой)
  workflow_dispatch:         # ручной запуск кнопкой

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare site directory (gh-pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site
            git -C site init -b gh-pages
            git -C site remote add origin "$REMOTE"
          fi

      - name: Collect data
        env:
          STALCRAFT_TOKEN: ${{ secrets.STALCRAFT_TOKEN }}
          REGION: ${{ vars.REGION || 'RU' }}
        run: node collect.js site/data

      - name: Publish
        run: |
          cp public/index.html site/index.html
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # держим в ветке один коммит, чтобы история не раздувала репозиторий
          git commit --amend -m "data update" || git commit -m "data update"
          git push --force origin gh-pages
