<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StalZone History</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #111a2e; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #818cf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--panel); color: var(--text);
         font-family: Inter, system-ui, "Segoe UI", sans-serif; }
  header { background: var(--bg); padding: 32px 16px 36px; text-align: center;
           border-bottom: 1px solid var(--border); }
  h1 { margin: 0 0 20px; font-size: 40px; color: var(--accent); }
  .search { position: relative; max-width: 640px; margin: 0 auto; }
  .search input { width: 100%; padding: 16px 20px; font-size: 16px; color: var(--text);
                  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  #suggest { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 5;
             background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
             overflow: hidden; text-align: left; display: none; }
  #suggest div { padding: 12px 20px; cursor: pointer; }
  #suggest div:hover { background: var(--panel2); }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid;
         grid-template-columns: 1fr 300px; gap: 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  h2 { margin: 0 0 14px; font-size: 20px; }
  h3 { margin: 18px 0 10px; font-size: 16px; }
  h3:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
          font-size: 14px; background: var(--panel2); opacity: .55; user-select: none; }
  .chip.on { opacity: 1; border-color: var(--accent); }
  .q0 { color: #cbd5e1; } .q1 { color: #86efac; } .q2 { color: #7dd3fc; }
  .q3 { color: #f0abfc; } .q4 { color: #f87171; } .q5 { color: #facc15; }
  .t0 { color: #86efac; } .t1 { color: #7dd3fc; } .t2 { color: #fb923c; }
  .stats { border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
  .stats div { display: flex; justify-content: space-between; padding: 10px 12px;
               background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
  .stats b { color: var(--accent); }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  button { background: #6366f1; color: #fff; border: 0; padding: 10px 18px; border-radius: 10px;
           cursor: pointer; font-size: 14px; }
  button:disabled { opacity: .4; cursor: default; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  th { background: var(--bg); padding: 12px; font-size: 14px; }
  th:first-child { border-radius: 10px 0 0 10px; } th:last-child { border-radius: 0 10px 10px 0; }
  td { text-align: center; padding: 12px; background: var(--panel); border-top: 1px solid var(--border);
       border-bottom: 1px solid var(--border); font-size: 14px; }
  td:first-child { border-left: 1px solid var(--border); border-radius: 10px 0 0 10px; color: var(--accent); font-weight: 600; }
  td:last-child { border-right: 1px solid var(--border); border-radius: 0 10px 10px 0; }
  .badge { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #111; }
  .b0 { background: #cbd5e1; } .b1 { background: #86efac; } .b2 { background: #7dd3fc; }
  .b3 { background: #f0abfc; } .b4 { background: #ef4444; color: #fff; } .b5 { background: #facc15; }
  .tier { background: var(--bg); padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 700; }
  .upd { margin-top: 14px; padding: 8px 12px; background: var(--panel2); border-radius: 8px; font-size: 13px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>StalZone History</h1>
  <div class="search">
    <input id="q" placeholder="Введите название артефакта" autocomplete="off">
    <div id="suggest"></div>
  </div>
</header>

<main>
  <section class="card">
    <h2 id="title">Выберите артефакт</h2>
    <div class="empty" id="hint">Начните вводить название в поиске выше</div>
    <div class="upd" id="upd" style="display:none"></div>
  </section>

  <aside class="card">
    <h3>Качество</h3>
    <div class="chips" id="qlt"></div>
    <h3>Тир</h3>
    <div class="chips" id="tier"></div>
    <h3>Статистика</h3>
    <div class="stats">
      <div>Средняя <b id="s-avg">—</b></div>
      <div>Макс. <b id="s-max">—</b></div>
      <div>Мин. <b id="s-min">—</b></div>
    </div>
  </aside>

  <section class="card wide">
    <div class="head">
      <h2 style="margin:0">История продаж</h2>
      <button id="dl" disabled>Скачать TXT</button>
    </div>
    <table>
      <thead><tr><th>Цена</th><th>Качество</th><th>Тир</th><th>Дата</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script>
const QUALITY = ['Обычный', 'Необычный', 'Особый', 'Редкий', 'Исключительный', 'Легендарный'];
const TIERS = [[0, 5], [6, 10], [11, 15]];
const SHOW_ROWS = 200;

const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString('ru-RU'));
const fmtDate = (t) => new Date(t).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
const getJson = async (url) => {
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status);
  return res.json();
};

let items = [];            // [{id, name}]
let current = null;        // {id, name}
let sales = [];            // [[время, цена, кол-во, качество, тир], ...] новые сверху
let updated = null;
let filtered = [];
const selQ = new Set(), selT = new Set();

// ----- чипы фильтров -----
function makeChips(box, labels, cls, set) {
  labels.forEach((label, i) => {
    const el = document.createElement('span');
    el.className = `chip ${cls}${i}`;
    el.textContent = label;
    el.onclick = () => {
      set.has(i) ? set.delete(i) : set.add(i);
      el.classList.toggle('on');
      render();
    };
    box.appendChild(el);
  });
}
makeChips(document.getElementById('qlt'), QUALITY, 'q', selQ);
makeChips(document.getElementById('tier'), TIERS.map(([a, b]) => `${a}-${b}`), 't', selT);

// ----- поиск -----
const input = document.getElementById('q');
const box = document.getElementById('suggest');
input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  box.innerHTML = '';
  if (!q) { box.style.display = 'none'; return; }
  const list = items.filter((i) => i.name.toLowerCase().includes(q)).slice(0, 15);
  list.forEach((it) => {
    const d = document.createElement('div');
    d.textContent = it.name;
    d.onclick = () => pick(it);
    box.appendChild(d);
  });
  box.style.display = list.length ? 'block' : 'none';
});
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) box.style.display = 'none'; });

async function pick(it) {
  current = it;
  input.value = it.name;
  box.style.display = 'none';
  history.replaceState(null, '', '#' + it.id);
  try { sales = await getJson(`data/sales/${it.id}.json`); } catch { sales = []; }
  render();
}

// ----- отрисовка -----
function render() {
  if (!current) return;
  document.getElementById('title').textContent = current.name;
  document.getElementById('hint').style.display = 'none';

  filtered = sales.filter(([, , , q, t]) =>
    (!selQ.size || selQ.has(q)) &&
    (!selT.size || [...selT].some((i) => t >= TIERS[i][0] && t <= TIERS[i][1]))
  );

  const prices = filtered.map((r) => r[1]);
  const avg = prices.length ? Math.round(prices.reduce((a, b) => a + b, 0) / prices.length) : null;
  document.getElementById('s-avg').textContent = fmt(avg);
  document.getElementById('s-max').textContent = prices.length ? fmt(Math.max(...prices)) : '—';
  document.getElementById('s-min').textContent = prices.length ? fmt(Math.min(...prices)) : '—';

  const upd = document.getElementById('upd');
  upd.style.display = 'block';
  upd.textContent = 'Данные обновлены: ' + (updated ? fmtDate(updated) : 'ещё не обновлялись');

  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">Продаж не найдено</td></tr>';
  }
  for (const [t, price, , qlt, ptn] of filtered.slice(0, SHOW_ROWS)) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td>${fmt(price)}</td>` +
      `<td><span class="badge b${qlt}">${QUALITY[qlt] ?? qlt}</span></td>` +
      `<td><span class="tier">+${ptn}</span></td>` +
      `<td>${fmtDate(t)}</td>`;
    tbody.appendChild(tr);
  }
  document.getElementById('dl').disabled = !filtered.length;
}

// ----- скачать TXT -----
document.getElementById('dl').onclick = () => {
  const lines = filtered.map(([t, price, amount, qlt, ptn]) =>
    `${price}\t${QUALITY[qlt] ?? qlt}\t+${ptn}\t${amount}\t${new Date(t).toLocaleString('ru-RU')}`);
  const text = 'Цена\tКачество\tТир\tКол-во\tДата\n' + lines.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = `${current.id}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
};

// ----- старт -----
(async () => {
  try {
    items = await getJson('data/items.json');
    updated = (await getJson('data/meta.json')).updated;
  } catch {
    document.getElementById('hint').textContent = 'Данные ещё не собраны. Запустите сборщик в GitHub Actions.';
    return;
  }
  const id = location.hash.slice(1);
  const it = items.find((i) => i.id === id);
  if (it) pick(it);
})();
</script>
</body>
</html>
